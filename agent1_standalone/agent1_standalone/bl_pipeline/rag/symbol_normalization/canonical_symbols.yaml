    - N_t
    - "N_{t}"
    - "ν_T/ν"
    durbin_2017:
    - R_T
    - "R_{T}"
    ge_arolla_durbin_2014:
    - R_t
    - "R_{t}"
    - "ν_T/ν"
    dick_kubacki_2017:
    - R_T
    - "R_{T}"
    - μ_t/μ
    - "\\mu_t/\\mu"
    friedlander_georgiadis_2023:
    - μ_t/μ
    - "\\mu_t/\\mu"
