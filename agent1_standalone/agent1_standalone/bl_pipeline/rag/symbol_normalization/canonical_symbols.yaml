momentum_thickness:
  canonical: θ
  display: θ
  unit: m
  description: Momentum thickness
  aliases:
  - theta
  - θ₁₁
  - θ_11
  - momentum thickness
  - mom. thickness
  - \theta
  - \Theta_{transition}
  # Mayle 1991 uses δ_0 for momentum thickness (Nomenclature p.215 of original).
  # Other papers (AGS, DN, Narasimha, LM) use θ canonically. δ_0 must be PAPER-
  # SCOPED to mayle_1991 because most other papers' δ_0 means "BL thickness at
  # reference station" or "initial value of δ" — collision risk.
  paper_specific_aliases:
    mayle_1991:
    - δ_0
    - δ₀
    - \delta_0
    - \delta_{0}
    coder_maughmer_2014:
    - δ_2
    - δ₂
    - \delta_2
    - \delta_{2}
    - "Re_{\\delta 2}"
    matsubara_alfredsson_2001:
    - δ_2
    - \delta_2
    durbin_wu_2007:
    - Θ
    - "\\Theta"
    - "(Θ+θ')"
    suzen_huang_2000:
    - θ_t
    - "\\theta_t"
    # Schlichting & Gersten 2017 (Symbol list p.713):
    #   "δ_2   m   boundary-layer thicknesses (momentum)"
    # Schlichting's δ_2 = momentum thickness θ in the canonical notation.
    schlichting_gersten_2017:
    - δ_2
    - δ₂
    - \delta_2
    - \delta_{2}
