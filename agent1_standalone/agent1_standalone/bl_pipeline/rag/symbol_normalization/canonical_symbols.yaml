    reed_saric_arnal_1996:
    - M̄
    - "\\bar{M}"
    liu_lu_wang_wang_yan_2022:
    - Ma_rel
    - "Ma_{rel}"

falkner_skan_hartree:
  canonical: β_h
  display: β_h
  unit: '-'
  description: |
    Hartree pressure-gradient parameter for the Falkner-Skan family,
    β_h = 2m/(m+1) where U_e ∝ x^m.  Range: −0.1988 (separation) → 0
    (Blasius) → 1.0 (stagnation/attachment line).  CONFLICT WARNING:
    bare β has many other uses (spanwise wavenumber, Clauser parameter,
    Emmons spot-velocity ratio).  Subscript h is mandatory.  Reed-
    Saric-Arnal 1996 instead writes G for this same parameter.
  aliases:
  - Hartree parameter
  - Falkner-Skan beta
  - "\\beta_h"
