    Reduced (Strouhal) frequency of wake passing in turbomachinery
    cascades, St = f_d · b_s / U_0 — wake-passing frequency times bar
    spacing on the wake-generator wheel, divided by inlet velocity.
    Used by Dick-Kubacki 2017 (= 1.22 for N3-60 cascade).  Distinct
