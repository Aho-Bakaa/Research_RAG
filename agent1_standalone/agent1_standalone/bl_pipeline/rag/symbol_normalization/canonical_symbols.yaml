    - H_t
    - H_L
    - H_T
    # Schlichting & Gersten 2017 (Symbol list p.711):
    #   "H_12, H_32   -   shape factors, Eq. (8.26), (8.27)"
    #   "Λ            -   shape factor, Eq. (15.27)"
    # H_12 = δ*/θ (canonical H), H_32 = δ_E/θ (energy shape factor — paper-
    # scoped here because outside Schlichting "H_32" is uncommon).  Λ is
    # Pohlhausen's shape parameter used in stability/transition analysis.
    schlichting_gersten_2017:
