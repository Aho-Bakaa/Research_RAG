# ── Pre-transitional / Walters-Cokljat-family auxiliary quantities ─────────

total_fluctuation_kinetic_energy:
  canonical: k_TOT
  display: k_{TOT}
  unit: m²/s²
  description: |
    Total fluctuation kinetic energy k_TOT = k_T + k_L used in
    Walters-Cokljat 2008 / Walters-Leylek 2004 / Furst 2012-13.
    Distinct from k (canonical TKE) because of the LAMINAR contribution.
  aliases:
  - k_total
  - k_{Tot}
  - k_TOT
  - "k_T + k_L"
  paper_specific_aliases:
    walters_cokljat_2008:
    - k_TOT
    - "k_{TOT}"
    walters_leylek_2004:
    - k_TOT
    - "k_{TOT}"
    furst_2013:
    - k_Tot
    - "k_{Tot}"
    liu_lu_wang_wang_yan_2022:
    - "k_L + v̄²"

walters_eff_length_scale:
  canonical: λ_eff
  display: λ_{eff}
  unit: m
  description: |
    Walters-Cokljat / Walters-Leylek / Furst effective turbulence length
    scale λ_eff = min(C_λ d, λ_T) where d is wall distance and λ_T is
    the unrestricted turbulence length scale.  Used in their k-k_L-ω
    model for shear sheltering and small-scale eddy-viscosity definition.
    CONFLICT WARNING: λ_eff is NOT the canonical Thwaites λ_θ — paper-
    scoped to the Walters family.
  aliases:
  - lambda_eff
  - λ_{eff}
  - effective length scale
  - "min(C_\\lambda d, \\lambda_T)"

walters_turb_length_scale:
  canonical: λ_T_turb
  display: λ_T
  unit: m
  description: |
    Walters-Cokljat / Furst unrestricted turbulence length scale
    λ_T = sqrt(k_T)/ω (k-ω version) or k^(3/2)/ε (k-ε version in
    Walters-Leylek 2004).  CONFLICT WARNING: distinct from canonical
    λ_θ (Thwaites pressure-gradient parameter) — paper-scoped to the
    Walters family.  Liu et al. 2022 use ξ_t for the analogous variable.
  aliases:
  - lambda_T
  - λ_{T}
  - turbulence length scale
  - "\\sqrt{k_T}/\\omega"

walters_shear_sheltering_function:
  canonical: f_SS
  display: f_{SS}
  unit: '-'
  description: |
    Walters-Cokljat / Walters-Leylek / Furst / Liu / Dick shear-sheltering
    damping function f_SS = exp[-(C_SS·ν·Ω/k_T)²], close to 1 outside
    the BL and 0 deep inside.  Limits which freestream turbulence
    "penetrates" past the BL edge into the pretransitional shear region
    (Hunt-Durbin sheltering).
  aliases:
  - f_SS
  - f_ss
  - shear-sheltering function
  - "\\exp[-(C_{SS} \\nu \\Omega / k_T)^2]"

walters_bypass_threshold:
  canonical: β_BP
  display: β_{BP}
  unit: '-'
  description: |
    Walters-Cokljat / Walters-Leylek / Furst / Liu / Dick BYPASS transition
    threshold function β_BP = 1 − exp(−φ_BP/A_BP), with φ_BP =
    max(k_T/(νΩ) − C_BP,crit, 0).  Activates the k_L → k_T transfer
    once the local Reynolds-number ratio exceeds the bypass threshold.
    CONFLICT WARNING: β here is NOT the Hartree pressure-gradient
    parameter or the Clauser parameter — paper-scoped strictly.
  aliases:
  - beta_BP
  - β_bp
  - bypass-threshold function

walters_natural_threshold:
  canonical: β_NAT
  display: β_{NAT}
  unit: '-'
  description: |
    Walters-Cokljat / Walters-Leylek / Furst / Liu / Dick NATURAL
    transition threshold function β_NAT = 1 − exp(−φ_NAT/A_NAT) with
    φ_NAT = max(Re_Ω − C_NAT,crit/f_NAT,crit, 0).  Drives the natural
    (TS-mediated) k_L → k_T transfer in the absence of bypass-class
    forcing.  CONFLICT WARNING: β here is NOT Hartree / Clauser β.
  aliases:
  - beta_NAT
  - β_nat
  - natural-threshold function

walters_TS_threshold:
  canonical: β_TS
  display: β_{TS}
  unit: '-'
  description: |
    Walters-Cokljat / Furst / Walters-Leylek Tollmien-Schlichting threshold
    function β_TS = 1 − exp(−(max(Re_Ω − C_TS,crit, 0))²/A_TS).  Activates
    the orderly-mode contribution to ν_T,l once the vorticity-Reynolds
    number exceeds the TS critical.
  aliases:
  - beta_TS
  - β_ts
  - Tollmien-Schlichting threshold function

walters_bypass_transfer:
  canonical: R_BP
  display: R_{BP}
  unit: m²/s³
  description: |
    Walters-Cokljat / Walters-Leylek / Furst / Liu / Dick BYPASS-transition
    energy-transfer term R_BP = C_R · β_BP · k_L · ω / f_W, transferring
    laminar kinetic energy k_L into the turbulent k equation.  CONFLICT
    WARNING: R is heavily overloaded — paper-scoped.
  aliases:
  - R_BP
  - bypass transfer
  - "C_R \\beta_{BP} k_L \\omega / f_W"

walters_natural_transfer:
  canonical: R_NAT
  display: R_{NAT}
  unit: m²/s³
  description: |
    Walters-Cokljat / Walters-Leylek / Furst / Liu / Dick NATURAL-transition
    energy-transfer term R_NAT = C_R,NAT · β_NAT · k_L · Ω.  Transfers
    laminar kinetic energy into k under TS-dominated breakdown.
  aliases:
  - R_NAT
  - natural transfer
  - "C_{R,NAT} \\beta_{NAT} k_L \\Omega"

re_vorticity_y2omega:
  canonical: Re_Ω
  display: Re_{\Omega}
  unit: '-'
  description: |
    Vorticity Reynolds number based on wall distance and vorticity
    magnitude, Re_Ω = d² Ω / ν.  Used by Walters-Cokljat 2008,
    Walters-Leylek 2004, Furst 2012/13, Dick-Kubacki 2017, Durbin 2012/
    2017, Ge-Arolla-Durbin 2014.  Closely related to the LM
    canonical Re_v = ρ y² Ω/μ (identical up to ρ factor).
  aliases:
  - Re_omega
  - "Re_{\\Omega}"
  - d^2 Omega / nu
  - vorticity Reynolds

walters_intermittency_damping:
  canonical: f_INT
  display: f_{INT}
  unit: '-'
  description: |
    Walters-Cokljat / Furst intermittency damping function
    f_INT = min(k_T/(C_INT (k_T+k_L)), 1) — represents the gradual
    transfer of laminar fluctuation energy into turbulent fluctuation
    energy as the boundary layer transitions.
  aliases:
  - f_INT
  - intermittency damping function

walters_wall_damping:
  canonical: f_W
  display: f_W
  unit: '-'
  description: |
    Walters-Cokljat / Furst near-wall damping function
    f_W = (λ_eff/λ_T)^(2/3), enforcing inviscid-near-wall behaviour of
    the small-scale eddy-viscosity branch.
  aliases:
  - f_W
  - inviscid wall damping function

