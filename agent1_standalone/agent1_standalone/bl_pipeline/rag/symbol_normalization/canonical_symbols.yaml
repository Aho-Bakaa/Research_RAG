# ── Klebanoff modes / streak instability ──────────────────────────────────

streak_amplitude:
  canonical: A_streak
  display: A
  unit: '-'
  description: |
    Klebanoff-streak nonlinear amplitude A = (1/2)[max(U-U_B) − min(U-U_B)]
    used as the bifurcation parameter for secondary instability of streaks.
    Critical A ≈ 26 % U_∞ for subharmonic-sinuous breakdown (ABH 2001)
    and ≈ 30 % U_∞ for streak breakdown (Brandt 2004).  CONFLICT WARNING:
    A also means Herbert's TS-wave amplitude, AGS log-law constant,
    Mack's incoming-wave amplitude, etc.  Paper-scoped strictly.
  aliases:
  - streak amplitude
  - Klebanoff streak amplitude
  paper_specific_aliases:
