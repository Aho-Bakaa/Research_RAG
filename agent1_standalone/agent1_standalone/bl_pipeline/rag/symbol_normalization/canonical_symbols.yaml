# ── Concept / mechanism labels (string tokens, not numerics) ──────────────

shear_sheltering:
  canonical: SHEAR_SHELTERING
  display: shear sheltering
  unit: '-'
  description: |
    Hunt-Durbin (1999) shear-sheltering mechanism — strong mean shear
    in the boundary layer filters out high-frequency freestream
    disturbances, admitting only low-frequency components that produce
    streaks.  Discussed by Zaki-Durbin 2005, Durbin-Wu 2007,
    Walters-Cokljat 2008, Walters-Leylek 2004, Furst 2012.  This is a
    CONCEPT TOKEN, not a number.
  aliases:
  - shear sheltering
  - Hunt-Durbin sheltering
  - shear filtering
  - sheltering effect

lift_up_effect:
  canonical: LIFT_UP_EFFECT
  display: lift-up effect
  unit: '-'
  description: |
    Landahl 1980 / Ellingsen-Palm 1975 / Moffatt 1967 lift-up mechanism —
    a wall-normal disturbance v' acting on the mean shear S = dU/dy
    produces a streamwise streak u' via du'/dt = -S·v'.  Algebraic
    (non-modal) growth of streaks.  CENTRAL to bypass transition:
    Jacobs-Durbin 2001, Brandt 2004, Durbin-Wu 2007, Reshotko 2001.
  aliases:
  - lift-up effect
  - lift-up mechanism
  - Landahl lift-up
  - algebraic growth
  - transient growth

kelvin_helmholtz_instability:
  canonical: KH_INSTABILITY
  display: Kelvin-Helmholtz instability
  unit: '-'
  description: |
    Kelvin-Helmholtz instability — inviscid inflectional instability of
    a free shear layer.  Central to laminar-separation-bubble transition
    (Diwan-Ramesh 2009, Marxen 2011, McAuliffe-Yaras 2010) and to
    top-of-BL breakdown of lifted streaks (Zaki-Durbin 2005, Durbin-Wu
    2007).  Most-amplified Strouhal Sr_θ ≈ 0.016 for planar free shear.
  aliases:
  - KH instability
  - Kelvin-Helmholtz
  - K-H instability
  - inflectional instability

