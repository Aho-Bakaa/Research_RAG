narasimha_intermittency_transform:
  canonical: F(γ)
  display: F(γ)
  unit: '-'
  description: |
    Narasimha 1985 §3 transform of intermittency:
        F(γ) = [-ln(1 − γ)]^(1/2)
    This linearises the universal γ(ξ) curve and is used to fit the
    breakdown rate from experimental γ distributions.  Distinct from
    F(λ_θ) (AGS pressure-gradient function).
  aliases:
  - F_gamma
  - F(gamma)
  paper_specific_aliases:
    narasimha_1985:
    - F(γ)
    - F(\gamma)
    dhawan_narasimha_1958:
    - F(γ)
    - F(\gamma)

narasimha_dimensionless_spot_rate:
  canonical: ñ
  display: ñ
  unit: '-'
  description: |
    Narasimha 1985 dimensionless spot-formation rate:
        ñ = n·σ·ν² / U³
    where n is the dimensional spot-formation rate (no./s·m) and σ is
    the spot-propagation factor.  Used in the intermittency formula
    γ(x) = 1 − exp(−ñ · σ · (x − x_t)²·U³/ν²).
  aliases:
  - n_tilde
  - n_dimensionless
  - dimensionless spot rate
  paper_specific_aliases:
    narasimha_1985:
    - ñ
    - \tilde{n}
    - \tilde n

narasimha_crumble_rate:
  canonical: N_crumble
  display: N
  unit: '-'
  description: |
    Narasimha 1985 non-dimensional spot-formation rate ("crumble"):
        N = n·σ·θ_t³ / ν
    where n is the dimensional spot rate, σ is the spot propagation
    factor, and θ_t is the momentum thickness at start of transition.
    CONFLICT WARNING: in stability theory N is the N-factor amplification
    exponent — these are DIFFERENT quantities sharing one letter.
    Paper-scoped to narasimha_1985 so we don't rewrite N anywhere
    stability papers use it.
  aliases:
  - N_n
  - N_n_crumble
  - Narasimha crumble
  paper_specific_aliases:
    narasimha_1985:
    - N

