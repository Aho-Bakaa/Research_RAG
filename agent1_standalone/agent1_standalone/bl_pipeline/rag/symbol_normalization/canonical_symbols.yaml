    - Re_y
    - "Re_{y}"
    walters_leylek_2004:
    - Re_y
    - "Re_{y}"

lm_vorticity_reynolds:
  canonical: Re_v
  display: Re_v
  unit: '-'
  description: |
    LANGTRY-MENTER 2009 vorticity Reynolds number, Re_v = ρ y² Ω / μ
