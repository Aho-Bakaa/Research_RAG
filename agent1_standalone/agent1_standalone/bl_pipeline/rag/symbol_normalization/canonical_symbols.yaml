lm_local_transition_reynolds:
  canonical: Re_θt_local
  display: \widetilde{Re}_{θ,t}
  unit: '-'
  description: |
    LANGTRY-MENTER 2009 LOCAL transition-onset momentum-thickness
    Reynolds number, obtained from a TRANSPORT equation (not the
    freestream correlation).  The tilde distinguishes it from the
    freestream-based Re_θ,t.  Defer to Agent 2 — this is a transport-
    equation closure quantity, not algebraic.
  aliases:
  - Re_theta_t_local
  - Re_{theta,t}_local
  paper_specific_aliases:
    langtry_menter_2009:
    - \widetilde{Re}_{θ t}
    - \widetilde{Re}_{\theta t}
    - \widetilde{Re}_{θ,t}

lm_critical_transition_reynolds:
  canonical: Re_θc
  display: Re_{θ,c}
  unit: '-'
  description: |
    LANGTRY-MENTER 2009 CRITICAL Re_θ — the threshold below which
    intermittency cannot grow.  Distinct from Re_θ,t (transition onset).
  aliases:
  - Re_theta_c
  - Re_{θ,c}
  - Re_{\theta,c}
  - Re_θ_crit
  paper_specific_aliases:
    langtry_menter_2009:
    - Re_{θc}

lm_viscosity_ratio:
  canonical: R_T
  display: R_T
  unit: '-'
  description: |
    LANGTRY-MENTER 2009 viscosity ratio R_T = μ_t/μ.  Used as input to
    F_onset.  CONFLICT WARNING: in some older papers R_T is the
    "correlation coefficient" (AGS uses it that way), and in others it
    is the turbulent Reynolds number.  Paper-scoped to LM 2009 (also
    Walters-Cokljat, who use the same convention).
  aliases:
  - viscosity_ratio
  - mu_t/mu
  paper_specific_aliases:
    langtry_menter_2009:
    - R_T
    - R_{T}
    walters_cokljat_2008:
    - R_T
    - R_{T}
    walters_leylek_2004:
    - R_T
    - R_{T}
