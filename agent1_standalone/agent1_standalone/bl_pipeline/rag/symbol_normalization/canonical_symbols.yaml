lm_wall_distance_reynolds:
  canonical: R_y
  display: R_y
  unit: '-'
  description: |
    LANGTRY-MENTER 2009 wall-distance-based turbulent Reynolds number
    R_y = ρ y √k / μ.  Input to F_onset.  CONFLICT WARNING:
    Coder-Maughmer 2014 also uses Re_y but defines it differently:
    Re_y = ρ U d/μ (velocity-based).  Same letter, distinct formula —
    paper-scoped.  Dick-Kubacki 2017 uses Re_y = √k y/ν (same as LM).
