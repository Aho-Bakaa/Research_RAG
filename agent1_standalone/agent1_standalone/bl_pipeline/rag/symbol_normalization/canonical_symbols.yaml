intermittency:
  canonical: γ
  display: γ
  unit: '-'
  description: Intermittency factor
  aliases:
  - gamma
  - \gamma
  - intermittency
  - γ_tr
  # MAJOR COLLISION: γ has many non-intermittency meanings across the literature.
  # The list below records the explicit DO-NOT-ALIAS cases (intermittency stays as
  # canonical γ but per-paper γ-symbols are NOT mapped here when they mean
  # something else — they are paper-scoped to OTHER canonicals).
  #   - Herbert 1988 γ = Floquet exponent → see floquet_exponent below
  #   - Mack 1984 γ = ratio of specific heats → see ratio_specific_heats below
  #   - Brandt 2004 γ = wall-normal wavenumber in OS continuous spectrum
  #   - ABH 2001 γ = Floquet detuning exponent
  #   - Jacobs-Durbin 2001 γ = oblique-wave angle (tan γ = k_z/ω)
  #   - Yoshikawa-Wesfreid 2011 γ = interfacial tension (N/m)
  #   - Kachanov 1994 γ_1 = soliton asymmetry coefficient
  #   - Reshotko 2001 γ = OS-Squire coupling coefficient ~ β·ū'
  #   - Liu 2022 γ_g = specific-heat ratio (1.4)
  #   - Emmons 1951 f (not γ) = intermittency — see Emmons paper_specific below.
  # Where γ DOES match canonical intermittency (Suzen-Huang, MA 2001, Dick,
  # Ge-Arolla-Durbin, Durbin 2012, Coder 2014 N_crit / γ_eff), the default
  # global alias handles it.
  paper_specific_aliases:
    emmons_1951:
    - f(P)
    - f_emmons
    - "f(P,t)"
    - fraction turbulent time
    suzen_huang_2000:
    - γ_sep
    - γ_eff
    ge_arolla_durbin_2014:
    - γ_eff
    - "\\gamma_{eff}"
    durbin_2012:
    - γ_max
    matsubara_alfredsson_2001:
    - γ
