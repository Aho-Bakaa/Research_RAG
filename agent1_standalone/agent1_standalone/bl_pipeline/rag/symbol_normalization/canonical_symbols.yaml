  # H_t / H_L / H_T are NOT global aliases — they collide with Coder's H_L
  # (local PG parameter) and with DN/Narasimha's own H_t / H_L / H_T usage.
  # See paper_specific_aliases below for DN.
  paper_specific_aliases:
    coder_maughmer_2014:
    - H_12
    - H_{12}
