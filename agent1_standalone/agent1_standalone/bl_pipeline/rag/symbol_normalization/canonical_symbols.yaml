    - "M_{\\infty}"
    - Ma_∞
    - "Ma_{\\infty}"
    liu_lu_wang_wang_yan_2022:
    - Ma_∞
    - "Ma_{\\infty}"
    - Ma_t
    - "Ma_{t}"

mack_relative_mach:
  canonical: M̄
  display: \bar{M}
  unit: '-'
  description: |
    Mack 1984 relative local Mach number M̄ = (αU + βW − ω)·M_1 /
    [sqrt(α²+β²)·T^(1/2)].  M̄² > 1 somewhere in the boundary layer
    is the necessary condition for Mack 2nd-mode (higher-mode)
    instability.  Real for temporal-neutral waves; complex otherwise.
    Liu et al. 2022 use Ma_rel for the same concept on hypersonic cones.
  aliases:
  - bar_M
  - M_bar
  - "\\bar{M}"
  - "\\bar{M}_1"
  - relative Mach number
  - relative local Mach number
  paper_specific_aliases:
    mack_1984:
