# ═══════════════════════════════════════════════════════════════════════════
# Generic length-of-transition (already covered under transition_length;
# we add paper-specific aliases here so each paper's convention maps in).
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
# 2026-05 EXPANSION (Wave 2) — synthesis of 13 agent-inventoried papers.
# These canonicals were added because the quantity either (a) appears in
# ≥2 of the 13 agent inventories, or (b) is the primary variable of a
# transport equation / correlation that a user is likely to query (e.g.,
# Coder's AFT ñ — only one paper but the central AFT variable).
# Every paper-specific alias is expanded to Unicode + LaTeX (tilde, hat,
# bar, prime, subscript) forms so the markdown corpus matches.
# ═══════════════════════════════════════════════════════════════════════════

# ── Compressible stability / Mack 1984 family ─────────────────────────────

mack_stability_reynolds:
  canonical: R_stab
  display: R
  unit: '-'
  description: |
    Mack 1984's primary stability Reynolds number based on the Falkner-
    Skan similarity length L* = sqrt(ν* x*/U_1*), so R = sqrt(Re_x).
    Used throughout compressible-stability tables (R_cr, R_L, R_U, R_s).
    CONFLICT WARNING: bare R also means chord-Reynolds in Van Ingen 1956,
    rotating-disk Reynolds in Saric-Reed-White 2003, or Re_δ in Westin
    1994 / Zaki-Durbin 2005.  Paper-scoped so it does not collide with
    canonical Re or with R_T (viscosity ratio in LM 2009).
  aliases:
  - R_Mack
  - sqrt(Re_x)
  - similarity Reynolds number
  paper_specific_aliases:
    mack_1984:
    - R_s
    - "R_{s}"
    - R_0
    - "R_{0}"
    - R_c
    - "R_{c}"
    - R_{cr}
    - R_cr
    - R_L
    - "R_{L}"
    - R_U
    - "R_{U}"
    - R_δ
    - "R_{\\delta}"
    reed_saric_arnal_1996:
    - R_RSA
    - sqrt(Re_x)
    - R_I
    - "R_{I}"
    - R_II
    - "R_{II}"
    saric_reed_white_2003:
    - R_disk
    - "R = r\\sqrt{\\Omega/\\nu}"

mack_critical_reynolds:
  canonical: R_cr
  display: R_{cr}
  unit: '-'
  description: |
    Minimum critical Reynolds number — smallest R at which a wave of any
    frequency or wave angle first becomes neutrally stable.  Distinct
    from R_L and R_U (lower/upper branch neutral points at fixed ω).
    Used in Mack 1984, Reed-Saric-Arnal 1996, Van Ingen 1956/2008,
    Schubauer-Skramstad 1947.
  aliases:
  - Re_cr
  - "Re_{cr}"
  - R_{cr}
  - R_crit
  - Re_crit
  - critical Reynolds number
  - minimum critical Reynolds number

mack_dimensionless_frequency:
  canonical: F_stab
  display: F
  unit: '-'
  description: |
    Mack 1984's dimensionless disturbance frequency F = ω* ν*/U_1*² = ω/R.
    Constant along a fixed-frequency wave trajectory in a Blasius layer;
    tabulated × 10⁶ throughout the linear-stability literature.  Used by
    Mack 1984, Van Ingen 2008, Reed-Saric-Arnal 1996, Herbert 1988,
    Westin 1994, Jacobs-Durbin 2001, Schubauer-Skramstad 1947.  CONFLICT
    WARNING: F is also (i) AGS's pressure-gradient function F(λ_θ),
    (ii) Langtry-Menter's F_onset / F_length closure functions,
    (iii) Brandt 2004's volume-forcing amplitude.  Paper-scoping
    confines this F to the stability-theory frequency parameter.
  aliases:
  - dimensionless frequency
  - F-frequency
  - frequency parameter
  - F-parameter
  - "F × 10^4"
  - "F × 10^6"
  - ω/R
  - "ω ν / U_∞^2"
  - "ω ν / U_1^{*2}"
  paper_specific_aliases:
    mack_1984:
    - F
    - "F × 10^4"
    van_ingen_2008:
    - F
    - F_∞
    - "F_{\\infty}"
    reed_saric_arnal_1996:
    - F
    - "F = 2 \\pi \\nu f / U_\\infty^2"
    herbert_1988:
    - F
    westin_et_al_1994:
    - F
    - "F = 2 \\pi f \\nu \\cdot 10^6 / U_0^2"
    jacobs_durbin_2001:
    - F
    - "F = 10^6 \\omega \\nu / U_\\infty^2"
    schubauer_skramstad_1947:
    - F_ss
    - "\\beta_r \\nu / U_0^2"

mack_edge_mach:
  canonical: M_e
  display: M_e
  unit: '-'
  description: |
    Mach number at the edge of the boundary layer, M_e = U_e/a_e.
    Primary control parameter of compressible-stability theory.  Mack
    1984 also uses M_∞ for the undisturbed-freestream Mach number on
    a swept wing.  Friedlander-Georgiadis 2023 uses M_∞ throughout.
  aliases:
  - M_1
  - "M_{1}"
  - M_∞
  - "M_{\\infty}"
  - M_inf
  - edge Mach number
  - freestream Mach number
  - Mach edge
  paper_specific_aliases:
    mack_1984:
