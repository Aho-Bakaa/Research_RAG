# Mayle 1991 — additions / clarifications
# ═══════════════════════════════════════════════════════════════════════════

mayle_acceleration_at_transition:
  canonical: K_t
  display: K_t
  unit: '-'
  description: |
    Acceleration parameter K = (ν/U²)(dU/dx) EVALUATED AT the start of
    transition (Mayle 1991 Fig. 2).  The base parameter K is already
    in the glossary under acceleration_parameter; K_t is the
    transition-onset value used as an axis in Mayle's regime maps.
  aliases:
  - K_t
  - K_{t}
  - K_transition
  paper_specific_aliases:
    mayle_1991:
    - K_t

mayle_wake_passing_period:
  canonical: τ_wake
  display: τ
  unit: s
  description: |
    Wake-passing period in Mayle 1991 — the time between successive
    upstream-blade-wake impingements on a downstream blade boundary
    layer.  CONFLICT WARNING: bare τ in turbulence-model literature
    means wall shear stress, and τ_t in AGS means turbulence intensity.
    Paper-scoped to mayle_1991.
  aliases:
  - wake_passing_period
  - tau_wake
  paper_specific_aliases:
    mayle_1991:
    - τ
    - \tau
    - τ_wake
    - τ_w (wake)

mayle_wake_passing_frequency:
  canonical: ω_wake
  display: ω
  unit: Hz
  description: |
    Wake-passing frequency in Mayle 1991, ω_wake = 2π/τ_wake.
    CONFLICT WARNING: bare ω is the specific dissipation rate in
    k-ω turbulence models.  Paper-scoped to mayle_1991.
  aliases:
  - wake_passing_frequency
  - omega_wake
  paper_specific_aliases:
    mayle_1991:
    - ω
    - \omega

mayle_thermal_intermittency:
  canonical: γ_h
  display: γ_h
  unit: '-'
  description: |
    Thermal intermittency factor (Mayle 1991) — used for heat-transfer
    transitional models where the thermal field lags the velocity-field
    intermittency γ.
  aliases:
  - gamma_h
  - thermal intermittency
  - γ_thermal
  paper_specific_aliases:
    mayle_1991:
    - γ_h
    - γₕ
    - \gamma_h

mayle_dimensionless_pg_parameter:
  canonical: λ_0
  display: λ_0
  unit: '-'
  description: |
    Mayle 1991 pressure-gradient parameter defined as λ_0 = (θ²/ν)(dU/dx).
    This is IDENTICAL to the Thwaites pressure-gradient parameter λ_θ
    in the canonical/AGS notation — Mayle just writes it as λ_0.
    Map to λ_θ via paper_specific_alias so AGS, LM, and Mayle chunks
    all retrieve under the same canonical token.
  aliases: []
  # All mappings handled below under pressure_gradient_parameter's
  # paper_specific_aliases for mayle_1991.

# ═══════════════════════════════════════════════════════════════════════════
# Langtry-Menter 2009 — additions
